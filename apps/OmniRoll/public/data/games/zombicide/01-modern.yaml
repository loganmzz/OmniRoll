# https://boardgamegeek.com/boardgame/113924/zombicide
#
# Design notes:
#
# Features:
# - `classic`: Classic compatible components
# - `modern`: Modern compatible components
#
# As Classic components can be used in a Modern game, they are featured as both `classic` and `modern` components.
#
# There are several kinds:
# * Survivor:
#   * Kids are marked using `kid` feature.
# * Mission:
#   * Custom property `difficulty` (number): `0` (tutorial), `1` (easy), `2` (medium), `3` (hard), `4` (very hard)
#   * Custom property `duration` (number, in minutes))
# * Competitive
# * Abomination
#
key: "zombicide"
name: "Zombicide"

updatedAt: "2026-10-24T00:00:00.000Z"

sets:
- include: "./01-01-classic.yaml"
- include: "./01-02-modern.yaml"

randomizers:

- key: "classic"
  name: "Classic"
  variables:
  - key: "survivors"
    name: "# of survivors"
    type: "integer"
    min: 1
    max: 12
    default: 6
  - key: "difficulty"
    name: "Difficulty"
    type: "range"
    min: 0
    max: 4
    default: [0, 4]
  - key: "duration"
    name: "Duration"
    type: "range"
    min: 0
    max: 600
    default: [0, 600]
  pools:
  - key: "survivors"
    criteria: |
      c.kinds == "Survivor"
  - key: "missions"
    criteria: >-
      c.kinds == "Mission" &&
      c.difficulty >= v.difficulty[0] && c.difficulty <= v.difficulty[1] &&
      c.duration >= v.duration[0] && c.duration <= v.duration[1]
  groups:
  - key: "survivors"
    name: "Survivors"
  - key: "mission"
    name: "Mission"
  slots:
  - key: "survivors"
    group: "survivors"
    count: |
      v.survivors
  - key: "mission"
    group: "mission"
