# https://www.zombicide.com/fantasy-zombicide-products/
# https://boardgamegeek.com/boardgame/176189/zombicide-black-plague
#
# Design notes:
#
# There are several kinds:
# * Survivor
# * Quest:
#   * Custom property `difficulty` (number): `0` (tutorial), `1` (easy), `2` (medium), `3` (hard), `4` (very hard)
#   * Custom property `duration` (number, in minutes)
#   * Custom property `minSurvivors` (number, optional)
#   * Custom property `maxSurvivors` (number, optional)
# * Competitive
key: "zombicide-fantasy"
name: "Zombicide Fantasy"

sets:
- include: "./02-01-black-plague.yaml"
- include: "./02-02-green-horde.yaml"
- include: "./02-03-white-death.yaml"


randomizers:

- key: "default"
  name: "Default"
  variables:
  - key: "survivors"
    name: "# of survivors"
    type: "integer"
    min: 1
    max: 12
    default: 6
  - key: "difficulty"
    name: "Difficulty"
    type: "range"
    min: 0
    max: 4
  - key: "duration"
    name: "Duration"
    type: "range"
    min: 0
    max: 600
  - key: "check_survivors"
    name: "Check survivor count?"
    type: "boolean"
    default: false
  - key: "include_campaign_quests"
    name: "Include campaign quests?"
    type: "boolean"
    default: false
  pools:
  - key: "survivors"
    criteria: |
      c.kinds == "Survivor"
  - key: "quests"
    criteria: |
      c.kinds == "Quest" &&
      c.difficulty in v.difficulty &&
      c.duration in v.duration &&
      (v.check_survivors && c.minSurvivors ? v.survivors >= c.minSurvivors : true) &&
      (v.check_survivors && c.maxSurvivors ? v.survivors <= c.maxSurvivors : true) &&
      (v.include_campaign_quests ? true : !("campaign" in c.features))
  groups:
  - key: "survivors"
    name: "Survivors"
  - key: "quest"
    name: "Quest"
  slots:
  - key: "survivors"
    group: "survivors"
    count: |
      v.survivors
    pool: "survivors"
  - key: "quest"
    group: "quest"
    pool: "quests"
